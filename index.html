<!doctype html>
<html>

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width,initial-scale=1"
    >

    <title>
        Unique EduZone RC2 v0.3
    </title>

    <link
        rel="stylesheet"
        href="assets/css/style.css"
    >

</head>


<body>


<header>

    <h1>
        Unique EduZone
    </h1>


    <nav>

        <a href="index.html">
            Home
        </a>


        <a href="pages/lessons.html">
            Lessons
        </a>


        <a href="pages/quiz.html">
            MCQ
        </a>


        <a href="pages/profile.html">
            👤 Student Profile
        </a>


        <a href="pages/dashboard.html">
            📊 Dashboard
        </a>

    </nav>

</header>



<main>


    <h2>
        RC2 v0.3 - MCQ Foundation
    </h2>


    <a href="pages/quiz.html">
        Start Quiz
    </a>



    <!-- Student Learning Area -->

    <section class="student-access">


        <div class="student-access-content">


            <span class="student-icon">
                👤
            </span>


            <div>

                <h2>
                    Student Learning Area
                </h2>


                <p id="studentWelcome">

                    Create your student profile and
                    start your learning journey.

                </p>

            </div>


        </div>



        <div class="student-access-buttons">


            <a
                href="pages/profile.html"
                class="student-button primary"
            >
                Create / Edit Profile
            </a>


            <a
                href="pages/dashboard.html"
                class="student-button secondary"
            >
                Open Dashboard
            </a>


        </div>


    </section>


</main>



<footer>

    <p>
        © 2026 Unique EduZone
    </p>

</footer>



<!-- Student Profile Name -->

<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {


        const studentName =
            localStorage.getItem(
                "uez_student_name"
            );


        const welcome =
            document.getElementById(
                "studentWelcome"
            );


        if (
            studentName &&
            welcome
        ) {


            welcome.textContent =
                "Welcome back, " +
                studentName +
                "! Continue your learning journey.";


        }


    }
);

</script>


</body>

</html>
