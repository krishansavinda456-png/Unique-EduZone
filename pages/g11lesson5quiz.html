// =====================================================
// QUIZ SETTINGS
// =====================================================

const QUIZ_TIME = 10 * 60;

let current = 0;

let answers =
    Array(questions.length).fill(null);

let finished = false;

let timeLeft = QUIZ_TIME;

let timer = null;

let quizStartedAt = null;

let quizFinishedAt = null;



// =====================================================
// TIMER
// =====================================================

function startTimer(){

    if(timer !== null){
        return;
    }

    quizStartedAt =
        new Date().toISOString();

    timer =
        setInterval(function(){

            timeLeft--;

            updateTimer();

            if(timeLeft <= 0){

                clearInterval(timer);

                timer = null;

                alert(
                    "⏰ Quiz කාලය අවසන් වී ඇත. Quiz එක ස්වයංක්‍රීයව Submit වේ."
                );

                autoSubmitQuiz();

            }

        },1000);

    updateTimer();

}



function updateTimer(){

    const timerElement =
        document.getElementById(
            "quizTimer"
        );

    if(!timerElement){
        return;
    }

    let minutes =
        Math.floor(
            timeLeft / 60
        );

    let seconds =
        timeLeft % 60;

    minutes =
        String(minutes).padStart(
            2,
            "0"
        );

    seconds =
        String(seconds).padStart(
            2,
            "0"
        );

    timerElement.textContent =
        "⏱️ ඉතිරි කාලය: " +
        minutes +
        ":" +
        seconds;


    if(timeLeft <= 60){

        timerElement.style.color =
            "#ff4444";

        timerElement.style.borderColor =
            "#ff4444";

        timerElement.style.background =
            "#2b1010";

    }else{

        timerElement.style.color =
            "#d4af37";

        timerElement.style.borderColor =
            "#d4af37";

        timerElement.style.background =
            "#211d0e";

    }

}



// =====================================================
// TIMER HTML
// =====================================================

function createTimer(){

    const hero =
        document.querySelector(
            ".hero"
        );

    if(!hero){
        return;
    }

    const oldTimer =
        document.getElementById(
            "quizTimer"
        );

    if(oldTimer){
        return;
    }

    const timerBox =
        document.createElement(
            "div"
        );

    timerBox.id =
        "quizTimer";

    timerBox.style.marginTop =
        "18px";

    timerBox.style.padding =
        "12px 20px";

    timerBox.style.border =
        "2px solid #d4af37";

    timerBox.style.borderRadius =
        "30px";

    timerBox.style.display =
        "inline-block";

    timerBox.style.background =
        "#211d0e";

    timerBox.style.color =
        "#d4af37";

    timerBox.style.fontWeight =
        "bold";

    timerBox.style.fontSize =
        "18px";

    hero.appendChild(
        timerBox
    );

}



// =====================================================
// RENDER QUESTION
// =====================================================

function render(){

    const q =
        questions[current];

    const box =
        document.getElementById(
            "quizBox"
        );


    let h =
        '<div class="question active">' +

        '<div class="question-number">' +

        'ප්‍රශ්නය ' +
        (current + 1) +
        ' / ' +
        questions.length +

        '</div>' +

        '<h2>' +
        q[0] +
        '</h2>';


    q[1].forEach(
        function(o,i){

            h +=

                '<button class="option ' +

                (
                    answers[current] === i
                    ?
                    'selected'
                    :
                    ''
                ) +

                '" onclick="selectOption(' +
                i +
                ')">' +

                String.fromCharCode(
                    65+i
                ) +

                '. ' +

                o +

                '</button>';

        }
    );


    h +=

        '<div class="note">' +

        'ඉඟිය: ගනුදෙනුවේ බලපෑම ආදායමක්, වියදමක්, වත්කමක් හෝ වගකීමක් ලෙස හඳුනාගෙන ගණනය කරන්න.' +

        '</div>' +

        '<div class="controls">';


    h +=

        '<button class="prev" onclick="previous()" ' +

        (
            current === 0
            ?
            'disabled'
            :
            ''
        ) +

        '>' +

        '← පෙර' +

        '</button>';


    if(
        current <
        questions.length - 1
    ){

        h +=

            '<button class="next" onclick="next()">' +

            'ඊළඟ →' +

            '</button>';

    }else{

        h +=

            '<button class="submit" onclick="submitQuiz()">' +

            'Quiz Submit ✓' +

            '</button>';

    }


    h +=
        '</div></div>';


    box.innerHTML =
        h;


    document.getElementById(
        "progressFill"
    ).style.width =

        (
            (current + 1) /
            questions.length *
            100
        ) +

        "%";


    document.getElementById(
        "progressText"
    ).textContent =

        'ප්‍රශ්නය ' +
        (current + 1) +
        ' / ' +
        questions.length;


    updateTimer();

}



// =====================================================
// SELECT ANSWER
// =====================================================

function selectOption(i){

    answers[current] =
        i;

    render();

}



// =====================================================
// NEXT
// =====================================================

function next(){

    if(
        answers[current] === null
    ){

        alert(
            "කරුණාකර පිළිතුරක් තෝරන්න."
        );

        return;
    }

    current++;

    render();

}



// =====================================================
// PREVIOUS
// =====================================================

function previous(){

    if(
        current > 0
    ){

        current--;

        render();

    }

}



// =====================================================
// SUBMIT
// =====================================================

function submitQuiz(){

    if(finished){
        return;
    }

    if(
        answers.some(
            function(a){

                return a === null;

            }
        )
    ){

        alert(
            "සියලුම ප්‍රශ්නවලට පිළිතුරු ලබාදී පසුව Submit කරන්න."
        );

        return;
    }

    finishQuiz(false);

}



// =====================================================
// AUTO SUBMIT
// =====================================================

function autoSubmitQuiz(){

    if(finished){
        return;
    }

    finishQuiz(true);

}



// =====================================================
// FINISH QUIZ
// =====================================================

function finishQuiz(
    timeExpired
){

    finished = true;


    if(timer !== null){

        clearInterval(timer);

        timer = null;

    }


    quizFinishedAt =
        new Date().toISOString();


    let score = 0;


    questions.forEach(
        function(q,i){

            if(
                answers[i] === q[2]
            ){

                score++;

            }

        }
    );


    const percentage =
        Math.round(
            (
                score /
                questions.length
            ) * 100
        );


    const timeUsed =
        QUIZ_TIME -
        Math.max(
            timeLeft,
            0
        );


    const minutesUsed =
        Math.floor(
            timeUsed / 60
        );


    const secondsUsed =
        timeUsed % 60;


    const timeUsedText =

        String(
            minutesUsed
        ).padStart(
            2,
            "0"
        ) +

        ":" +

        String(
            secondsUsed
        ).padStart(
            2,
            "0"
        );



    // =================================================
    // RESULT DISPLAY
    // =================================================

    document.getElementById(
        "quizBox"
    ).style.display =
        "none";


    document.getElementById(
        "resultBox"
    ).style.display =
        "block";


    document.getElementById(
        "score"
    ).textContent =

        score +
        " / " +
        questions.length;


    let resultMessage = "";


    if(timeExpired){

        resultMessage =
            "⏰ කාලය අවසන් වීම නිසා Quiz එක ස්වයංක්‍රීයව Submit කරන ලදී.";

    }

    else if(
        score ===
        questions.length
    ){

        resultMessage =
            "විශිෂ්ටයි! ගිණුම් ගැටළු විසඳීමේ හැකියාව ඉතා හොඳයි.";

    }

    else if(
        score >= 7
    ){

        resultMessage =
            "හොඳයි! ගැලපුම් සටහන් හා ගිණුම් ගණනයන් තව ටිකක් පුනරීක්ෂණය කරන්න.";

    }

    else{

        resultMessage =
            "පාඩම නැවත අධ්‍යයනය කර ගිණුම් ගැටළු නැවත පුහුණු කරන්න.";

    }


    document.getElementById(
        "resultMessage"
    ).innerHTML =

        resultMessage +

        "<br><br>" +

        "ලකුණු: " +
        score +
        " / " +
        questions.length +

        "<br>" +

        "ප්‍රතිශතය: " +
        percentage +
        "%" +

        "<br>" +

        "ගත වූ කාලය: " +
        timeUsedText;



    // =================================================
    // REVIEW
    // =================================================

    let r = "";


    questions.forEach(
        function(q,i){

            r +=

                '<div class="review-item">' +

                '<strong>' +

                (i+1) +

                '. ' +

                q[0] +

                '</strong><br>';


            if(
                answers[i] === q[2]
            ){

                r +=
                    "✓ ඔබගේ පිළිතුර නිවැරදියි.";

            }else{

                r +=

                    "✗ නිවැරදි පිළිතුර: " +

                    q[1][q[2]] +

                    ".";

            }


            r +=

                "<br>" +

                q[3] +

                "</div>";

        }
    );


    document.getElementById(
        "review"
    ).innerHTML =
        r;



    // =================================================
    // SAVE QUIZ RESULT
    // =================================================

    const quizResult = {

        grade:11,

        lesson:5,

        lessonTitle:
            "ගැලපුම් සටහන් සහිත මූල්‍ය ප්‍රකාශන",

        totalQuestions:
            questions.length,

        score:
            score,

        percentage:
            percentage,

        timeLimit:
            QUIZ_TIME,

        timeUsed:
            timeUsed,

        timeUsedText:
            timeUsedText,

        completed:
            true,

        completedAt:
            quizFinishedAt,

        startedAt:
            quizStartedAt,

        timeExpired:
            timeExpired

    };


    localStorage.setItem(

        "grade11_lesson5_quiz_result",

        JSON.stringify(
            quizResult
        )

    );


    localStorage.setItem(

        "grade11_lesson5_quiz_score",

        score

    );


    localStorage.setItem(

        "grade11_lesson5_quiz_percentage",

        percentage

    );


    localStorage.setItem(

        "grade11_lesson5_quiz_completed",

        "true"

    );



    // =================================================
    // GRADE 11 DASHBOARD DATA
    // =================================================

    let grade11Data = {};


    try{

        grade11Data =

            JSON.parse(

                localStorage.getItem(
                    "grade11Progress"
                ) ||
                "{}"

            );

    }catch(error){

        grade11Data = {};

    }


    grade11Data.lesson5 = {

        completed:
            true,

        quizCompleted:
            true,

        score:
            score,

        percentage:
            percentage,

        timeUsed:
            timeUsed,

        completedAt:
            quizFinishedAt

    };


    localStorage.setItem(

        "grade11Progress",

        JSON.stringify(
            grade11Data
        )

    );



    // =================================================
    // GENERAL LESSON COMPLETION
    // =================================================

    let completedLessons = {};


    try{

        completedLessons =

            JSON.parse(

                localStorage.getItem(

                    "grade11CompletedLessons"

                ) ||
                "{}"

            );

    }catch(error){

        completedLessons = {};

    }


    completedLessons["5"] =
        true;


    localStorage.setItem(

        "grade11CompletedLessons",

        JSON.stringify(
            completedLessons
        )

    );

}



// =====================================================
// RESTART
// =====================================================

function restartQuiz(){

    if(timer !== null){

        clearInterval(timer);

        timer = null;

    }


    current = 0;


    answers =
        Array(
            questions.length
        ).fill(null);


    finished = false;


    timeLeft =
        QUIZ_TIME;


    quizStartedAt =
        null;


    quizFinishedAt =
        null;


    document.getElementById(
        "resultBox"
    ).style.display =
        "none";


    document.getElementById(
        "quizBox"
    ).style.display =
        "block";


    render();

    startTimer();

}



// =====================================================
// COMPLETE QUIZ
// =====================================================

function completeQuiz(){

    const result =

        localStorage.getItem(

            "grade11_lesson5_quiz_result"

        );


    if(!result){

        alert(

            "කරුණාකර පළමුව Quiz එක සම්පූර්ණ කරන්න."

        );

        return;

    }


    localStorage.setItem(

        "grade11_lesson5_quiz_completed",

        "true"

    );


    localStorage.setItem(

        "grade11_lesson5_completed",

        "true"

    );


    alert(

        "✓ Grade 11 Lesson 5 Quiz සම්පූර්ණ කරන ලදී!"

    );

}



// =====================================================
// PAGE START
// =====================================================

createTimer();

render();

startTimer();


</script>
