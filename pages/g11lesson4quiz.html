"පහත සඳහන් ඒවා අතරින් ජංගම වත්කමකට වඩාත් සුදුසු උදාහරණයක් කුමක්ද?",

[
"ගොඩනැගිල්ල",
"ඉඩම",
"කාර්යාල ගෘහභාණ්ඩ",
"ණයගැතියෝ"
],

3,

"ණයගැතියෝ සාපේක්ෂව කෙටි කාලයකදී මුදල් බවට පත් කළ හැකි බැවින් ජංගම වත්කම් යටතට අයත් වේ."
]

];


// =====================================================
// QUIZ SETTINGS
// =====================================================

const QUIZ_TIME = 10 * 60;

let current = 0;

let answers =
    Array(questions.length).fill(null);

let finished = false;

let timeLeft = QUIZ_TIME;

let timer = null;

let quizStartedAt = null;

let quizFinishedAt = null;


// =====================================================
// SHUFFLED QUESTIONS
// =====================================================

let shuffledQuestions = [];


/*
 * පිළිතුරු විකල්ප පමණක් Shuffle කරයි.
 * ප්‍රශ්නවල අනුපිළිවෙල වෙනස් නොවේ.
 *
 * Original questions array එක වෙනස් නොකර,
 * shuffledQuestions තුළ වෙනම copy එකක් සාදයි.
 */

function shuffleQuestions(){

    shuffledQuestions =
        questions.map(function(q){

            const originalOptions =
                q[1];

            const correctAnswer =
                originalOptions[q[2]];

            const shuffledOptions =
                [...originalOptions];


            // Fisher-Yates Shuffle

            for(
                let i =
                    shuffledOptions.length - 1;

                i > 0;

                i--
            ){

                const j =
                    Math.floor(
                        Math.random() *
                        (i + 1)
                    );


                [
                    shuffledOptions[i],
                    shuffledOptions[j]

                ] = [

                    shuffledOptions[j],
                    shuffledOptions[i]

                ];

            }


            /*
             * Shuffle වූ options අතර
             * නිවැරදි පිළිතුර තිබෙන
             * නව index එක සොයාගැනීම
             */

            const newCorrectIndex =
                shuffledOptions.indexOf(
                    correctAnswer
                );


            return [

                q[0],

                shuffledOptions,

                newCorrectIndex,

                q[3]

            ];

        });

}


// =====================================================
// TIMER
// =====================================================

function startTimer(){

    if(timer !== null){
        return;
    }

    quizStartedAt =
        new Date().toISOString();

    timer =
        setInterval(function(){

            timeLeft--;

            updateTimer();

            if(timeLeft <= 0){

                clearInterval(timer);

                timer = null;

                alert(
                    "⏰ Quiz කාලය අවසන් වී ඇත. Quiz එක ස්වයංක්‍රීයව Submit වේ."
                );

                autoSubmitQuiz();

            }

        },1000);

    updateTimer();

}


function updateTimer(){

    const timerElement =
        document.getElementById(
            "quizTimer"
        );

    if(!timerElement){
        return;
    }

    let minutes =
        Math.floor(
            timeLeft / 60
        );

    let seconds =
        timeLeft % 60;

    minutes =
        String(minutes).padStart(
            2,
            "0"
        );

    seconds =
        String(seconds).padStart(
            2,
            "0"
        );

    timerElement.textContent =
        "⏱️ ඉතිරි කාලය: " +
        minutes +
        ":" +
        seconds;


    if(timeLeft <= 60){

        timerElement.style.color =
            "#ff4444";

        timerElement.style.borderColor =
            "#ff4444";

        timerElement.style.background =
            "#2b1010";

    }else{

        timerElement.style.color =
            "#d4af37";

        timerElement.style.borderColor =
            "#d4af37";

        timerElement.style.background =
            "#211d0e";

    }

}


// =====================================================
// TIMER HTML
// =====================================================

function createTimer(){

    const hero =
        document.querySelector(
            ".hero"
        );

    if(!hero){
        return;
    }

    const oldTimer =
        document.getElementById(
            "quizTimer"
        );

    if(oldTimer){
        return;
    }

    const timerBox =
        document.createElement(
            "div"
        );

    timerBox.id =
        "quizTimer";

    timerBox.style.marginTop =
        "18px";

    timerBox.style.padding =
        "12px 20px";

    timerBox.style.border =
        "2px solid #d4af37";

    timerBox.style.borderRadius =
        "30px";

    timerBox.style.display =
        "inline-block";

    timerBox.style.background =
        "#211d0e";

    timerBox.style.color =
        "#d4af37";

    timerBox.style.fontWeight =
        "bold";

    timerBox.style.fontSize =
        "18px";

    hero.appendChild(
        timerBox
    );

}


// =====================================================
// RENDER QUESTION
// =====================================================

function render(){

    const q =
        shuffledQuestions[current];

    const box =
        document.getElementById(
            "quizBox"
        );


    let h =
        '<div class="question active">' +

        '<div class="question-number">' +

        'ප්‍රශ්නය ' +
        (current + 1) +
        ' / ' +
        shuffledQuestions.length +

        '</div>' +

        '<h2>' +
        q[0] +
        '</h2>';


    q[1].forEach(
        function(o,i){

            h +=

                '<button class="option ' +

                (
                    answers[current] === i
                    ?
                    'selected'
                    :
                    ''
                ) +

                '" onclick="selectOption(' +
                i +
                ')">' +

                String.fromCharCode(
                    65+i
                ) +

                '. ' +

                o +

                '</button>';

        }
    );


    h +=

        '<div class="note">' +

        'ඉඟිය: ප්‍රශ්නයේ දත්ත, ගිණුම්කරණ සංකල්පය සහ අදාළ ගණනය කිරීම සසඳන්න.' +

        '</div>' +

        '<div class="controls">';


    h +=

        '<button class="prev" onclick="previous()" ' +

        (
            current === 0
            ?
            'disabled'
            :
            ''
        ) +

        '>' +

        '← පෙර' +

        '</button>';


    if(
        current <
        shuffledQuestions.length - 1
    ){

        h +=

            '<button class="next" onclick="next()">' +

            'ඊළඟ →' +

            '</button>';

    }else{

        h +=

            '<button class="submit" onclick="submitQuiz()">' +

            'Quiz Submit ✓' +

            '</button>';

    }


    h +=
        '</div></div>';


    box.innerHTML =
        h;


    document.getElementById(
        "progressFill"
    ).style.width =

        (
            (current + 1) /
            shuffledQuestions.length *
            100
        ) +

        "%";


    document.getElementById(
        "progressText"
    ).textContent =

        'ප්‍රශ්නය ' +
        (current + 1) +
        ' / ' +
        shuffledQuestions.length;


    updateTimer();

}


// =====================================================
// SELECT ANSWER
// =====================================================

function selectOption(i){

    answers[current] =
        i;

    render();

}


// =====================================================
// NEXT
// =====================================================

function next(){

    if(
        answers[current] === null
    ){

        alert(
            "කරුණාකර පිළිතුරක් තෝරන්න."
        );

        return;
    }

    current++;

    render();

}


// =====================================================
// PREVIOUS
// =====================================================

function previous(){

    if(
        current > 0
    ){

        current--;

        render();

    }

}


// =====================================================
// SUBMIT
// =====================================================

function submitQuiz(){

    if(finished){
        return;
    }

    if(
        answers.some(
            function(a){

                return a === null;

            }
        )
    ){

        alert(
            "සියලුම ප්‍රශ්නවලට පිළිතුරු ලබාදී පසුව Submit කරන්න."
        );

        return;
    }

    finishQuiz(false);

}


// =====================================================
// AUTO SUBMIT
// =====================================================

function autoSubmitQuiz(){

    if(finished){
        return;
    }

    finishQuiz(true);

}


// =====================================================
// FINISH QUIZ
// =====================================================

function finishQuiz(
    timeExpired
){

    finished = true;


    if(timer !== null){

        clearInterval(timer);

        timer = null;

    }


    quizFinishedAt =
        new Date().toISOString();


    let score = 0;


    /*
     * IMPORTANT:
     * මෙහිදී original questions වෙනුවට
     * shuffledQuestions භාවිතා කරයි.
     *
     * එම නිසා options shuffle කළත්
     * correct answer එක නිවැරදිව
     * පරීක්ෂා වේ.
     */

    shuffledQuestions.forEach(
        function(q,i){

            if(
                answers[i] === q[2]
            ){

                score++;

            }

        }
    );


    const percentage =
        Math.round(
            (
                score /
                shuffledQuestions.length
            ) * 100
        );


    const timeUsed =
        QUIZ_TIME -
        Math.max(
            timeLeft,
            0
        );


    const minutesUsed =
        Math.floor(
            timeUsed / 60
        );


    const secondsUsed =
        timeUsed % 60;


    const timeUsedText =

        String(
            minutesUsed
        ).padStart(
            2,
            "0"
        ) +

        ":" +

        String(
            secondsUsed
        ).padStart(
            2,
            "0"
        );


    // =================================================
    // RESULT DISPLAY
    // =================================================

    document.getElementById(
        "quizBox"
    ).style.display =
        "none";


    document.getElementById(
        "resultBox"
    ).style.display =
        "block";


    document.getElementById(
        "score"
    ).textContent =

        score +
        " / " +
        shuffledQuestions.length;


    let resultMessage = "";


    if(timeExpired){

        resultMessage =
            "⏰ කාලය අවසන් වීම නිසා Quiz එක ස්වයංක්‍රීයව Submit කරන ලදී.";

    }

    else if(
        score ===
        shuffledQuestions.length
    ){

        resultMessage =
            "විශිෂ්ටයි! මූල්‍ය ප්‍රකාශන පාඩම ඉතා හොඳින් අවබෝධ කරගෙන ඇත.";

    }

    else if(
        score >= 7
    ){

        resultMessage =
            "හොඳයි! මූල්‍ය ප්‍රකාශන හා ගිණුම්කරණ ගණනය කිරීම් තව ටිකක් පුනරීක්ෂණය කරන්න.";

    }

    else{

        resultMessage =
            "පාඩම නැවත අධ්‍යයනය කර Quiz එක නැවත කරන්න.";

    }


    document.getElementById(
        "resultMessage"
    ).innerHTML =

        resultMessage +

        "<br><br>" +

        "ලකුණු: " +
        score +
        " / " +
        shuffledQuestions.length +

        "<br>" +

        "ප්‍රතිශතය: " +
        percentage +
        "%" +

        "<br>" +

        "ගත වූ කාලය: " +
        timeUsedText;


    // =================================================
    // REVIEW
    // =================================================

    let r = "";


    shuffledQuestions.forEach(
        function(q,i){

            r +=

                '<div class="review-item">' +

                '<strong>' +

                (i+1) +

                '. ' +

                q[0] +

                '</strong><br>';


            if(
                answers[i] === q[2]
            ){

                r +=
                    "✓ ඔබගේ පිළිතුර නිවැරදියි.";

            }else{

                r +=

                    "✗ නිවැරදි පිළිතුර: " +

                    q[1][q[2]] +

                    ".";

            }


            r +=

                "<br>" +

                q[3] +

                "</div>";

        }
    );


    document.getElementById(
        "review"
    ).innerHTML =
        r;


    // =================================================
    // SAVE QUIZ RESULT
    // =================================================

    const quizResult = {

        grade: 11,

        lesson: 4,

        lessonTitle:
            "ව්‍යාපාරයක මූල්‍ය ප්‍රකාශන",

        totalQuestions:
            shuffledQuestions.length,

        score:
            score,

        percentage:
            percentage,

        timeLimit:
            QUIZ_TIME,

        timeUsed:
            timeUsed,

        timeUsedText:
            timeUsedText,

        completed:
            true,

        completedAt:
            quizFinishedAt,

        startedAt:
            quizStartedAt,

        timeExpired:
            timeExpired

    };


    localStorage.setItem(

        "grade11_lesson4_quiz_result",

        JSON.stringify(
            quizResult
        )

    );


    // Existing compatibility keys

    localStorage.setItem(

        "grade11_lesson4_quiz_score",

        score

    );


    localStorage.setItem(

        "grade11_lesson4_quiz_percentage",

        percentage

    );


    localStorage.setItem(

        "grade11_lesson4_quiz_completed",

        "true"

    );


    // =================================================
    // GRADE 11 DASHBOARD DATA
    // =================================================

    let grade11Data = {

        lesson4: {

            completed:
                true,

            quizCompleted:
                true,

            score:
                score,

            percentage:
                percentage,

            timeUsed:
                timeUsed,

            completedAt:
                quizFinishedAt

        }

    };


    try{

        const oldData =

            JSON.parse(

                localStorage.getItem(
                    "grade11Progress"
                ) ||
                "{}"

            );


        oldData.lesson4 =
            grade11Data.lesson4;


        localStorage.setItem(

            "grade11Progress",

            JSON.stringify(
                oldData
            )

        );


    }catch(error){

        localStorage.setItem(

            "grade11Progress",

            JSON.stringify(
                grade11Data
            )

        );

    }


    // =================================================
    // GENERAL LESSON COMPLETION
    // =================================================

    let completedLessons = {};


    try{

        completedLessons =

            JSON.parse(

                localStorage.getItem(

                    "grade11CompletedLessons"

                ) ||
                "{}"

            );

    }catch(error){

        completedLessons = {};

    }


    completedLessons["4"] =
        true;


    localStorage.setItem(

        "grade11CompletedLessons",

        JSON.stringify(
            completedLessons
        )

    );

}


// =====================================================
// RESTART
// =====================================================

function restartQuiz(){

    if(timer !== null){

        clearInterval(timer);

        timer = null;

    }


    /*
     * Restart කළ විට options නැවත Shuffle කරයි.
     */

    shuffleQuestions();


    current = 0;


    answers =
        Array(
            shuffledQuestions.length
        ).fill(null);


    finished = false;


    timeLeft =
        QUIZ_TIME;


    quizStartedAt =
        null;


    quizFinishedAt =
        null;


    document.getElementById(
        "resultBox"
    ).style.display =
        "none";


    document.getElementById(
        "quizBox"
    ).style.display =
        "block";


    render();

    startTimer();

}


// =====================================================
// COMPLETE QUIZ
// =====================================================

function completeQuiz(){

    const result =

        localStorage.getItem(

            "grade11_lesson4_quiz_result"

        );


    if(!result){

        alert(

            "කරුණාකර පළමුව Quiz එක සම්පූර්ණ කරන්න."

        );

        return;

    }


    localStorage.setItem(

        "grade11_lesson4_quiz_completed",

        "true"

    );


    localStorage.setItem(

        "grade11_lesson4_completed",

        "true"

    );


    alert(

        "✓ Grade 11 Lesson 4 Quiz සම්පූර්ණ කරන ලදී!"

    );

}


// =====================================================
// PAGE START
// =====================================================

/*
 * Page එක load වන විට පළමුව
 * options Shuffle කරයි.
 */

shuffleQuestions();

createTimer();

render();

startTimer();

</script>
