/* =====================================================
   QUIZ SETTINGS
===================================================== */

const QUIZ_TIME = 10 * 60;

let current = 0;

let answers =
    Array(lesson2Questions.length).fill(null);

let finished = false;

let timeLeft = QUIZ_TIME;

let timer = null;

let quizStartedAt = null;

let quizFinishedAt = null;


/* =====================================================
   TIMER
===================================================== */

function startTimer() {

    if (timer !== null) {
        return;
    }


    quizStartedAt =
        new Date().toISOString();


    timer = setInterval(
        function () {

            timeLeft--;

            updateTimer();


            if (timeLeft <= 0) {

                clearInterval(timer);

                timer = null;

                alert(
                    "⏰ Quiz කාලය අවසන් වී ඇත. Quiz එක ස්වයංක්‍රීයව Submit වේ."
                );

                autoSubmitQuiz();

            }

        },
        1000
    );


    updateTimer();

}


function updateTimer() {

    const timerElement =
        document.getElementById(
            "quizTimer"
        );


    if (!timerElement) {
        return;
    }


    let minutes =
        Math.floor(
            timeLeft / 60
        );


    let seconds =
        timeLeft % 60;


    minutes =
        String(minutes).padStart(
            2,
            "0"
        );


    seconds =
        String(seconds).padStart(
            2,
            "0"
        );


    timerElement.textContent =
        "⏱️ ඉතිරි කාලය: " +
        minutes +
        ":" +
        seconds;


    if (timeLeft <= 60) {

        timerElement.style.color =
            "#ff4444";

        timerElement.style.borderColor =
            "#ff4444";

        timerElement.style.background =
            "#2b1010";

    } else {

        timerElement.style.color =
            "#d4af37";

        timerElement.style.borderColor =
            "#d4af37";

        timerElement.style.background =
            "#211d0e";

    }

}


/* =====================================================
   RENDER
===================================================== */

function render() {

    const q =
        lesson2Questions[current];


    const box =
        document.getElementById(
            "quizBox"
        );


    let h =
        '<div class="question active">' +

        '<div class="question-number">' +

        'ප්‍රශ්නය ' +
        (current + 1) +
        ' / ' +
        lesson2Questions.length +

        '</div>' +

        '<h2>' +

        q[0] +

        '</h2>';


    q[1].forEach(
        function (option, i) {

            h +=

                '<button ' +

                'type="button" ' +

                'class="option ' +

                (
                    answers[current] === i
                    ? 'selected'
                    : ''
                ) +

                '" ' +

                'onclick="selectOption(' +
                i +
                ')"' +

                '>' +

                String.fromCharCode(
                    65 + i
                ) +

                '. ' +

                option +

                '</button>';

        }
    );


    h +=

        '<div class="note">' +

        '💡 ඉඟිය: ප්‍රශ්නයේ අර්ථය සහ පාඩමේ අදාළ කළමණාකරණ සංකල්පය සසඳන්න.' +

        '</div>' +


        '<div class="controls">';


    h +=

        '<button ' +

        'type="button" ' +

        'class="prev" ' +

        'onclick="previous()" ' +

        (
            current === 0
            ? 'disabled'
            : ''
        ) +

        '>' +

        '← පෙර' +

        '</button>';


    if (
        current <
        lesson2Questions.length - 1
    ) {

        h +=

            '<button ' +

            'type="button" ' +

            'class="next" ' +

            'onclick="next()"' +

            '>' +

            'ඊළඟ →' +

            '</button>';

    } else {

        h +=

            '<button ' +

            'type="button" ' +

            'class="submit" ' +

            'onclick="submitQuiz()"' +

            '>' +

            'Quiz Submit ✓' +

            '</button>';

    }


    h +=
        '</div></div>';


    box.innerHTML = h;


    document.getElementById(
        "progressFill"
    ).style.width =

        (
            (current + 1) /
            lesson2Questions.length *
            100
        ) +

        "%";


    document.getElementById(
        "progressText"
    ).textContent =

        "ප්‍රශ්නය " +

        (current + 1) +

        " / " +

        lesson2Questions.length;


    updateTimer();

}


/* =====================================================
   SELECT OPTION
===================================================== */

function selectOption(i) {

    answers[current] = i;

    render();

}


/* =====================================================
   NEXT
===================================================== */

function next() {

    if (
        answers[current] === null
    ) {

        alert(
            "කරුණාකර පිළිතුරක් තෝරන්න."
        );

        return;
    }


    if (
        current <
        lesson2Questions.length - 1
    ) {

        current++;

        render();

    }

}


/* =====================================================
   PREVIOUS
===================================================== */

function previous() {

    if (current > 0) {

        current--;

        render();

    }

}


/* =====================================================
   SUBMIT
===================================================== */

function submitQuiz() {

    if (finished) {
        return;
    }


    if (
        answers.some(
            function (answer) {
                return answer === null;
            }
        )
    ) {

        alert(
            "සියලුම ප්‍රශ්නවලට පිළිතුරු ලබාදී පසුව Submit කරන්න."
        );

        return;
    }


    finishQuiz(false);

}


/* =====================================================
   AUTO SUBMIT
===================================================== */

function autoSubmitQuiz() {

    if (finished) {
        return;
    }


    finishQuiz(true);

}


/* =====================================================
   FINISH QUIZ
===================================================== */

function finishQuiz(timeExpired) {

    finished = true;


    if (timer !== null) {

        clearInterval(timer);

        timer = null;

    }


    quizFinishedAt =
        new Date().toISOString();


    let score = 0;


    lesson2Questions.forEach(
        function (q, i) {

            if (
                answers[i] === q[2]
            ) {

                score++;

            }

        }
    );


    const percentage =
        Math.round(
            (
                score /
                lesson2Questions.length
            ) * 100
        );


    const timeUsed =
        QUIZ_TIME -
        Math.max(
            timeLeft,
            0
        );


    const minutesUsed =
        Math.floor(
            timeUsed / 60
        );


    const secondsUsed =
        timeUsed % 60;


    const timeUsedText =

        String(minutesUsed)
        .padStart(2, "0") +

        ":" +

        String(secondsUsed)
        .padStart(2, "0");


    /* =========================================
       RESULT
    ========================================= */

    document.getElementById(
        "quizBox"
    ).style.display =
        "none";


    document.getElementById(
        "resultBox"
    ).style.display =
        "block";


    document.getElementById(
        "score"
    ).textContent =

        score +
        " / " +
        lesson2Questions.length;


    let resultMessage;


    if (timeExpired) {

        resultMessage =
            "⏰ කාලය අවසන් වීම නිසා Quiz එක ස්වයංක්‍රීයව Submit කරන ලදී.";

    }

    else if (
        score ===
        lesson2Questions.length
    ) {

        resultMessage =
            "විශිෂ්ටයි! පාඩම ඉතා හොඳින් අවබෝධ කරගෙන ඇත. 🎉";

    }

    else if (score >= 7) {

        resultMessage =
            "හොඳයි! තව ටිකක් පුනරීක්ෂණය කරන්න. 👍";

    }

    else {

        resultMessage =
            "පාඩම නැවත අධ්‍යයනය කර Quiz එක නැවත කරන්න. 💪";

    }


    document.getElementById(
        "resultMessage"
    ).innerHTML =

        resultMessage +

        "<br><br>" +

        "ලකුණු: " +
        score +
        " / " +
        lesson2Questions.length +

        "<br>" +

        "ප්‍රතිශතය: " +
        percentage +
        "%" +

        "<br>" +

        "ගත වූ කාලය: " +
        timeUsedText;


    /* =========================================
       REVIEW
    ========================================= */

    let reviewHTML = "";


    lesson2Questions.forEach(
        function (q, i) {

            reviewHTML +=

                '<div class="review-item">' +

                '<strong>' +

                (i + 1) +

                ". " +

                q[0] +

                '</strong><br>';


            if (
                answers[i] === q[2]
            ) {

                reviewHTML +=

                    '<span class="correct-answer">' +

                    "✓ ඔබගේ පිළිතුර නිවැරදියි." +

                    "</span>";

            }

            else {

                reviewHTML +=

                    '<span class="wrong-answer">' +

                    "✗ නිවැරදි පිළිතුර: " +

                    q[1][q[2]] +

                    "</span>";

            }


            reviewHTML +=

                "<br>" +

                q[3] +

                "</div>";

        }
    );


    document.getElementById(
        "review"
    ).innerHTML =
        reviewHTML;


    /* =========================================
       SAVE LESSON 2 RESULT
    ========================================= */

    const quizResult = {

        grade: 11,

        lesson: 2,

        lessonTitle:
            "කළමණාකරණය",

        totalQuestions:
            lesson2Questions.length,

        score:
            score,

        percentage:
            percentage,

        timeLimit:
            QUIZ_TIME,

        timeUsed:
            timeUsed,

        timeUsedText:
            timeUsedText,

        completed:
            true,

        completedAt:
            quizFinishedAt,

        startedAt:
            quizStartedAt,

        timeExpired:
            timeExpired

    };


    localStorage.setItem(

        "grade11_lesson2_quiz_result",

        JSON.stringify(
            quizResult
        )

    );


    localStorage.setItem(

        "grade11_lesson2_quiz_score",

        score

    );


    localStorage.setItem(

        "grade11_lesson2_quiz_percentage",

        percentage

    );


    localStorage.setItem(

        "grade11_lesson2_quiz_completed",

        "true"

    );


    /* =========================================
       EXISTING GRADE 11 SYSTEM
    ========================================= */

    localStorage.setItem(

        "uez_grade11_last_score",

        percentage

    );


    const oldCount =

        Number(

            localStorage.getItem(

                "uez_grade11_quiz_count"

            )

        ) || 0;


    localStorage.setItem(

        "uez_grade11_quiz_count",

        oldCount + 1

    );


    localStorage.setItem(

        "uez_grade11_lesson2_score",

        percentage

    );


    /* =========================================
       COMPLETED LESSONS
    ========================================= */

    let completedLessons = [];


    try {

        completedLessons =

            JSON.parse(

                localStorage.getItem(

                    "uez_grade11_completed_lessons"

                ) || "[]"

            );


    }

    catch (error) {

        completedLessons = [];

    }


    if (
        !Array.isArray(
            completedLessons
        )
    ) {

        completedLessons = [];

    }


    const lessonId =
        "lesson2";


    if (
        !completedLessons.includes(
            lessonId
        )
    ) {

        completedLessons.push(
            lessonId
        );

    }


    localStorage.setItem(

        "uez_grade11_completed_lessons",

        JSON.stringify(
            completedLessons
        )

    );


    /* =========================================
       GRADE 11 PROGRESS
    ========================================= */

    try {

        const oldData =

            JSON.parse(

                localStorage.getItem(
                    "grade11Progress"
                ) || "{}"

            );


        oldData.lesson2 = {

            completed: true,

            quizCompleted: true,

            score: score,

            percentage: percentage,

            timeUsed: timeUsed,

            completedAt:
                quizFinishedAt

        };


        localStorage.setItem(

            "grade11Progress",

            JSON.stringify(
                oldData
            )

        );

    }

    catch (error) {

        console.log(
            "Grade 11 progress save error:",
            error
        );

    }


    /* =========================================
       GRADE 11 COMPLETED LESSONS
    ========================================= */

    let grade11Completed = {};


    try {

        grade11Completed =

            JSON.parse(

                localStorage.getItem(

                    "grade11CompletedLessons"

                ) || "{}"

            );

    }

    catch (error) {

        grade11Completed = {};

    }


    grade11Completed["2"] = true;


    localStorage.setItem(

        "grade11CompletedLessons",

        JSON.stringify(
            grade11Completed
        )

    );

}


/* =====================================================
   RESTART
===================================================== */

function restartQuiz() {

    if (timer !== null) {

        clearInterval(timer);

        timer = null;

    }


    current = 0;


    answers =
        Array(
            lesson2Questions.length
        ).fill(null);


    finished = false;


    timeLeft =
        QUIZ_TIME;


    quizStartedAt = null;

    quizFinishedAt = null;


    document.getElementById(
        "resultBox"
    ).style.display =
        "none";


    document.getElementById(
        "quizBox"
    ).style.display =
        "block";


    render();

    startTimer();

}


/* =====================================================
   COMPLETE QUIZ
===================================================== */

function completeQuiz() {

    const result =

        localStorage.getItem(

            "grade11_lesson2_quiz_result"

        );
