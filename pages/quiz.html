<!DOCTYPE html>
<html lang="si">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MCQ Quiz | Unique EduZone</title>

    <link
        rel="stylesheet"
        href="../assets/css/style.css"
    >

    <style>

        .quiz-page {
            max-width: 900px;
            margin: auto;
            padding: 30px 20px;
        }

        .quiz-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .quiz-header h1 {
            margin-bottom: 8px;
        }

        /* =========================
           LESSON SELECTOR
        ========================= */

        .lesson-selector {
            display: grid;
            grid-template-columns:
                repeat(4, 1fr);

            gap: 10px;

            margin-bottom: 25px;
        }

        .lesson-selector a {
            display: block;

            text-align: center;

            padding: 12px 8px;

            background: #1b1b1b;

            border: 1px solid #444;

            border-radius: 10px;

            color: #fff;

            text-decoration: none;

            font-weight: bold;

            transition: 0.3s;
        }

        .lesson-selector a:hover {
            background: gold;
            color: #000;
        }

        .lesson-selector a.active {
            background: gold;
            color: #000;
        }

        /* =========================
           QUIZ INFO
        ========================= */

        .quiz-info {
            display: flex;

            justify-content:
                space-between;

            align-items: center;

            gap: 15px;

            margin-bottom: 20px;

            flex-wrap: wrap;
        }

        .quiz-counter {
            font-weight: bold;
        }

        .quiz-timer {
            background: #dc3545;

            color: white;

            padding: 10px 18px;

            border-radius: 10px;

            font-weight: bold;

            min-width: 90px;

            text-align: center;
        }

        .quiz-timer.warning {
            background: #ff9800;
        }

        .quiz-timer.safe {
            background: #198754;
        }

        /* =========================
           QUIZ CARD
        ========================= */

        .quiz-card {
            background: #1b1b1b;

            border: 1px solid #333;

            border-radius: 15px;

            padding: 25px;

            margin-bottom: 20px;
        }

        #question {
            font-size: 20px;

            line-height: 1.7;

            margin-bottom: 20px;
        }

        /* =========================
           OPTIONS
        ========================= */

        #options {
            display: flex;

            flex-direction: column;

            gap: 12px;
        }

        .quiz-option {
            width: 100%;

            padding: 14px;

            border-radius: 10px;

            border: 1px solid #444;

            background: #262626;

            color: #fff;

            text-align: left;

            cursor: pointer;

            font-size: 16px;

            transition: 0.2s;
        }

        .quiz-option:hover {
            background: #333;
        }

        .quiz-option:disabled {
            cursor: not-allowed;
        }

        /* =========================
           BOTTOM
        ========================= */

        .quiz-bottom {
            display: flex;

            justify-content:
                space-between;

            align-items: center;

            gap: 15px;

            margin-top: 20px;

            flex-wrap: wrap;
        }

        #score {
            font-weight: bold;
        }

        #nextBtn {
            padding: 12px 25px;

            border: none;

            border-radius: 10px;

            background: gold;

            color: #000;

            font-weight: bold;

            cursor: pointer;
        }

        #nextBtn:disabled {
            opacity: 0.5;

            cursor: not-allowed;
        }

        .back-link {
            text-align: center;

            margin-top: 25px;
        }

        .back-link a {
            color: gold;

            text-decoration: none;

            font-weight: bold;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .lesson-selector {
                grid-template-columns:
                    repeat(2, 1fr);
            }

            #question {
                font-size: 18px;
            }

            .quiz-option {
                font-size: 15px;
            }

        }

    </style>

</head>


<body>


<header class="site-header">

    <div class="logo">
        Unique EduZone
    </div>


    <nav>

        <a href="../index.html">
            Home
        </a>

        <a href="lessons.html">
            Lessons
        </a>

        <a href="quiz.html">
            MCQ
        </a>

        <a href="dashboard.html">
            Dashboard
        </a>

        <a href="profile.html">
            Profile
        </a>

    </nav>

</header>



<main class="quiz-page">


    <section class="quiz-header">

        <h1>
            📝 Business Studies MCQ
        </h1>

        <p id="lessonTitle">
            Select a lesson
        </p>

    </section>



    <!-- =========================
         LESSON SELECTOR
    ========================== -->

    <div class="lesson-selector">

        <a
            href="quiz.html?lesson=1"
            id="lessonLink1"
        >
            Lesson 1
        </a>

        <a
            href="quiz.html?lesson=2"
            id="lessonLink2"
        >
            Lesson 2
        </a>

        <a
            href="quiz.html?lesson=3"
            id="lessonLink3"
        >
            Lesson 3
        </a>

        <a
            href="quiz.html?lesson=4"
            id="lessonLink4"
        >
            Lesson 4
        </a>

    </div>



    <!-- =========================
         QUIZ INFO
    ========================== -->

    <div class="quiz-info">

        <div
            class="quiz-counter"
            id="questionCounter"
        >
            Question 1 of 10
        </div>


        <div
            class="quiz-timer safe"
            id="quizTimer"
        >
            10:00
        </div>

    </div>



    <!-- =========================
         QUIZ
    ========================== -->

    <section class="quiz-card">


        <div id="question">
            Loading question...
        </div>


        <div id="options">
        </div>


        <div class="quiz-bottom">

            <div id="score">
                Score: 0 / 10
            </div>


            <button
                id="nextBtn"
                disabled
            >
                Next →
            </button>

        </div>


    </section>



    <div class="back-link">

        <a href="lessons.html">
            ← Back to Lessons
        </a>

    </div>


</main>



<footer class="site-footer">

    <p>
        © 2026 Unique EduZone. All Rights Reserved.
    </p>

</footer>



<script src="../assets/js/quiz.js"></script>


</body>

</html>
