<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        MCQ Quiz | Unique EduZone
    </title>

    <link
        rel="stylesheet"
        href="../assets/css/style.css"
    >

    <style>

        .quiz-page {
            max-width: 900px;
            margin: auto;
            padding: 30px 20px;
        }

        .quiz-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .quiz-info {
            background: #1b1b1b;
            border: 1px solid #333;
            border-radius: 15px;
            padding: 18px;
            margin-bottom: 20px;
        }

        .quiz-info-top {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            flex-wrap: wrap;
        }

        .timer {
            color: gold;
            font-size: 22px;
            font-weight: bold;
        }

        .quiz-progress {
            margin-top: 12px;
            color: #ccc;
        }

        .question-card {
            background: #1b1b1b;
            border: 1px solid #333;
            border-radius: 15px;
            padding: 22px;
            margin-bottom: 20px;
        }

        .question-number {
            color: gold;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .question-text {
            font-size: 18px;
            font-weight: bold;
            line-height: 1.6;
            margin-bottom: 18px;
        }

        .option {
            display: block;
            background: #252525;
            border: 1px solid #444;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
            cursor: pointer;
        }

        .option:hover {
            border-color: gold;
        }

        .option input {
            margin-right: 10px;
        }

        .quiz-actions {
            text-align: center;
            margin-top: 25px;
        }

        .quiz-button {
            background: gold;
            color: #000;
            border: none;
            border-radius: 8px;
            padding: 12px 25px;
            font-weight: bold;
            cursor: pointer;
        }

        .quiz-button:hover {
            opacity: 0.9;
        }

        .result-card {
            display: none;
            background: #1b1b1b;
            border: 1px solid gold;
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            margin-top: 25px;
        }

        .result-score {
            color: gold;
            font-size: 40px;
            font-weight: bold;
        }

        .result-message {
            margin: 15px 0;
            line-height: 1.7;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: gold;
            text-decoration: none;
            font-weight: bold;
        }

    </style>

</head>


<body>


<header class="site-header">

    <div class="logo">
        Unique EduZone
    </div>

    <nav>

        <a href="../index.html">Home</a>

        <a href="lessons.html">Lessons</a>

        <a href="quiz.html">MCQ</a>

        <a href="dashboard.html">Dashboard</a>

        <a href="profile.html">Profile</a>

    </nav>

</header>



<main class="quiz-page">


    <section class="quiz-header">

        <h1 id="quizTitle">
            📝 MCQ Quiz
        </h1>

        <p>
            Test your knowledge.
        </p>

    </section>



    <section class="quiz-info">

        <div class="quiz-info-top">

            <strong id="lessonName">
                Lesson
            </strong>

            <div
                class="timer"
                id="timer"
            >
                10:00
            </div>

        </div>

        <div
            class="quiz-progress"
            id="quizProgress"
        >
            Question 0 / 10
        </div>

    </section>



    <form id="quizForm">

        <div id="questionsContainer"></div>


        <div class="quiz-actions">

            <button
                type="submit"
                class="quiz-button"
                id="submitQuizButton"
            >
                Submit Quiz
            </button>

        </div>

    </form>



    <section
        class="result-card"
        id="resultCard"
    >

        <h2>
            🎉 Quiz Completed
        </h2>

        <div
            class="result-score"
            id="resultScore"
        >
            0%
        </div>

        <p
            class="result-message"
            id="resultMessage"
        ></p>

        <a
            href="lessons.html"
            class="back-link"
        >
            ← Back to Lessons
        </a>

    </section>


</main>



<footer class="site-footer">

    <p>
        © 2026 Unique EduZone. All Rights Reserved.
    </p>

</footer>



<script src="../assets/js/grade11-quiz.js"></script>

</body>

</html>
