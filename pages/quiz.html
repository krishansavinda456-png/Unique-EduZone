<!DOCTYPE html>
<html lang="si">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        MCQ Quiz | Unique EduZone
    </title>

    <link
        rel="stylesheet"
        href="../assets/css/style.css"
    >

    <style>

        .quiz-page {

            max-width: 900px;
            margin: auto;
            padding: 30px 20px;

        }

        .quiz-header {

            text-align: center;
            margin-bottom: 25px;

        }

        .quiz-header h1 {

            margin-bottom: 10px;

        }

        #quizLessonTitle {

            color: gold;
            font-weight: bold;

        }

        .lesson-selector {

            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin: 20px 0;

        }

        .lesson-select {

            padding: 8px 14px;
            border-radius: 8px;
            background: #222;
            border: 1px solid #444;
            color: #fff;
            text-decoration: none;

        }

        .lesson-select:hover {

            border-color: gold;
            color: gold;

        }

        .lesson-select.selected {

            background: gold;
            color: #000;
            border-color: gold;
            font-weight: bold;

        }

        .quiz-card {

            background: #1b1b1b;
            border: 1px solid #333;
            border-radius: 15px;
            padding: 25px;

        }

        .quiz-top {

            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;

        }

        #questionCounter {

            color: #ccc;

        }

        #timer {

            color: gold;
            font-size: 22px;
            font-weight: bold;

        }

        #timer.warning {

            color: red;

        }

        #question {

            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;

        }

        #options {

            display: grid;
            gap: 12px;

        }

        .quiz-option {

            width: 100%;
            padding: 14px;

            background: #222;
            color: #fff;

            border: 1px solid #444;
            border-radius: 10px;

            text-align: left;
            cursor: pointer;

            font-size: 16px;

        }

        .quiz-option:hover {

            border-color: gold;

        }

        #score {

            margin-top: 20px;
            color: gold;
            font-weight: bold;

        }

        #nextBtn {

            margin-top: 20px;

            padding: 12px 22px;

            border: none;
            border-radius: 8px;

            background: gold;
            color: #000;

            font-weight: bold;

            cursor: pointer;

        }

        #nextBtn:disabled {

            background: #555;
            color: #aaa;
            cursor: not-allowed;

        }

        .quiz-result {

            display: none;

            background: #1b1b1b;

            border: 1px solid #333;

            border-radius: 15px;

            padding: 30px;

            text-align: center;

        }

        #resultPercentage {

            color: gold;

            font-size: 45px;

            font-weight: bold;

            margin: 20px 0;

        }

        #resultMessage {

            font-size: 18px;

            margin-bottom: 20px;

        }

        .result-button {

            display: inline-block;

            padding: 12px 20px;

            background: gold;

            color: #000;

            text-decoration: none;

            border-radius: 8px;

            font-weight: bold;

            margin: 5px;

        }

        .result-button.secondary {

            background: #444;
            color: #fff;

        }

        @media (max-width: 600px) {

            .quiz-page {

                padding: 20px 12px;

            }

            .quiz-top {

                flex-direction: column;
                align-items: flex-start;

            }

            #question {

                font-size: 18px;

            }

        }

    </style>

</head>


<body>


<header class="site-header">

    <div class="logo">
        Unique EduZone
    </div>


    <nav>

        <a href="../index.html">
            Home
        </a>

        <a href="lessons.html">
            Lessons
        </a>

        <a href="quiz.html">
            MCQ
        </a>

        <a href="dashboard.html">
            Dashboard
        </a>

        <a href="profile.html">
            Profile
        </a>

    </nav>

</header>



<main class="quiz-page">


    <section class="quiz-header">

        <h1>
            📝 MCQ Quiz
        </h1>

        <p id="quizLessonTitle">
            Lesson 01
        </p>

    </section>



    <!-- LESSON SELECTOR -->

    <div class="lesson-selector">

        <a
            href="quiz.html?lesson=1"
            class="lesson-select"
            data-lesson="1"
        >
            Lesson 1
        </a>

        <a
            href="quiz.html?lesson=2"
            class="lesson-select"
            data-lesson="2"
        >
            Lesson 2
        </a>

        <a
            href="quiz.html?lesson=3"
            class="lesson-select"
            data-lesson="3"
        >
            Lesson 3
        </a>

        <a
            href="quiz.html?lesson=4"
            class="lesson-select"
            data-lesson="4"
        >
            Lesson 4
        </a>

        <a
            href="quiz.html?lesson=5"
            class="lesson-select"
            data-lesson="5"
        >
            Lesson 5
        </a>

    </div>



    <!-- QUIZ -->

    <section
        class="quiz-card"
        id="quizCard"
    >

        <div class="quiz-top">

            <strong id="questionCounter">
                Question 1 of 10
            </strong>

            <strong id="timer">
                10:00
            </strong>

        </div>


        <div id="question">
            Loading question...
        </div>


        <div id="options"></div>


        <div id="score">
            Score: 0 / 10
        </div>


        <button
            id="nextBtn"
            disabled
        >
            Next Question
        </button>

    </section>



    <!-- RESULT -->

    <section
        class="quiz-result"
        id="quizResult"
    >

        <h2>
            Quiz Completed
        </h2>


        <div id="resultPercentage">
            0%
        </div>


        <p id="resultMessage">
            Quiz completed.
        </p>


        <a
            href="lessons.html"
            class="result-button"
        >
            📚 Back to Lessons
        </a>


        <a
            href="dashboard.html"
            class="result-button secondary"
        >
            📊 Dashboard
        </a>

    </section>


</main>



<footer class="site-footer">

    <p>
        © 2026 Unique EduZone. All Rights Reserved.
    </p>

</footer>



<script src="../assets/js/quiz.js"></script>


</body>

</html>
