<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

        Lesson 1 Quiz | Unique EduZone

    <link
        rel="stylesheet"
        href="../assets/css/style.css"
    >

    <link
        rel="stylesheet"
        href="../assets/css/quiz.css"
    >

</head>


<body>


<header class="site-header">

    <div class="logo">
        Unique EduZone
    </div>


    <nav>

        <a href="../index.html">
            Home
        </a>

        <a href="lessons.html">
            Lessons
        </a>

        <a href="quiz.html">
            MCQ
        </a>

        <a href="dashboard.html">
            Dashboard
        </a>

        <a href="profile.html">
            Profile
        </a>

    </nav>

</header>



<main class="quiz-container">


    <!-- Quiz Title -->

    <h1>
        Lesson 1 Quiz
    </h1>


    <p>
        ව්‍යාපාර පිළිබඳ මූලික පදනම
    </p>


    <p>
        ප්‍රශ්න 10ක්
    </p>



    <!-- Timer -->

    <div class="timer-box">

        <span>
            Time Remaining:
        </span>

        <strong id="quizTimer">
            01:00
        </strong>

    </div>



    <!-- Question Number -->

    <div
        id="questionNumber"
        class="question-number"
    >
        Question 1 of 10
    </div>



    <!-- Progress -->

    <div class="quiz-progress-container">

        <div
            id="quizProgress"
            class="quiz-progress"
            style="width:0%;"
        ></div>

    </div>



    <!-- Question -->

    <div
        id="questionBox"
        class="question-box"
    >
    </div>



    <!-- Options -->

    <div
        id="optionsBox"
        class="options-box"
    >
    </div>



    <!-- Next Button -->

    <button
        id="nextButton"
        onclick="nextQuestion()"
        class="next-button"
        disabled
    >
        Next
    </button>



    <!-- Quiz Information -->

    <p
        id="quizMessage"
        class="quiz-message"
    >
        පිළිතුරක් තෝරා Next ඔබන්න.
    </p>


</main>



<footer class="site-footer">

    <p>
        © 2026 Unique EduZone
    </p>

</footer>



<script src="../assets/js/quiz.js"></script>


</body>

</html>
