<!DOCTYPE html>
<html lang="si">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
Grade 11 - Lesson 3 Quiz | Unique EduZone
</title>


<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0
}


body{
    font-family:Arial,"Noto Sans Sinhala",sans-serif;
    background:#080808;
    color:#f5f5f5;
    line-height:1.7
}


header{
    background:#111;
    border-bottom:2px solid #d4af37;
    padding:16px 6%;
    position:sticky;
    top:0;
    z-index:10
}


.header-inner{
    max-width:1000px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between
}


.logo{
    display:flex;
    align-items:center;
    gap:12px
}


.logo img{
    width:52px;
    height:52px;
    object-fit:contain
}


.logo-text{
    color:#d4af37;
    font-size:21px;
    font-weight:bold
}


.back-btn{
    color:#080808;
    background:#d4af37;
    text-decoration:none;
    padding:7px 17px;
    border-radius:25px;
    font-weight:bold
}


.container{
    width:92%;
    max-width:1000px;
    margin:30px auto 70px
}


.hero,
.quiz-box,
.result-box{
    background:#111;
    border:1px solid #d4af37;
    border-radius:18px;
    padding:28px;
    margin-bottom:24px
}


.hero{
    text-align:center;
    background:linear-gradient(
        135deg,
        #111,
        #1d1d1d
    )
}


.hero h1{
    color:#d4af37;
    font-size:31px;
    margin-bottom:8px
}


.hero p{
    color:#ddd
}


.progress{
    height:12px;
    background:#333;
    border-radius:20px;
    overflow:hidden;
    margin-top:16px
}


.progress-fill{
    height:100%;
    width:0;
    background:linear-gradient(
        90deg,
        #b8860b,
        #ffd700
    );
    transition:.3s
}


.question{
    display:none
}


.question.active{
    display:block
}


.question-number{
    color:#d4af37;
    font-weight:bold;
    margin-bottom:8px
}


.question h2{
    font-size:21px;
    margin-bottom:18px
}


.option{
    display:block;
    width:100%;
    text-align:left;
    background:#191919;
    color:#f5f5f5;
    border:1px solid #3b3b3b;
    border-radius:10px;
    padding:12px 15px;
    margin:9px 0;
    cursor:pointer;
    font-size:16px
}


.option:hover,
.option.selected{
    border-color:#d4af37;
    background:#2a2410
}


.controls{
    display:flex;
    justify-content:space-between;
    gap:12px;
    margin-top:24px
}


button{
    border:0;
    border-radius:25px;
    padding:11px 24px;
    font-weight:bold;
    cursor:pointer;
    font-size:15px
}


.next,
.submit{
    background:#d4af37;
    color:#080808
}


.prev{
    background:#333;
    color:#fff
}


button:disabled{
    opacity:.4;
    cursor:not-allowed
}


.note{
    margin-top:16px;
    background:#211d0e;
    border-left:4px solid #d4af37;
    padding:13px;
    border-radius:8px
}


.result-box{
    display:none;
    text-align:center
}


.score{
    font-size:42px;
    color:#d4af37;
    font-weight:bold
}


.result-box h2{
    color:#d4af37;
    margin-bottom:10px
}


.result-box button{
    margin:7px;
    background:#d4af37;
    color:#080808
}


.review{
    margin-top:20px;
    text-align:left
}


.review-item{
    padding:13px;
    border-bottom:1px solid #333
}


.review-item strong{
    color:#d4af37
}


footer{
    text-align:center;
    padding:25px;
    color:#aaa;
    border-top:1px solid #333
}


@media(max-width:650px){

    .hero h1{
        font-size:25px
    }

    .quiz-box{
        padding:19px
    }

    .question h2{
        font-size:19px
    }

    .controls{
        flex-direction:column
    }

    .controls button{
        width:100%
    }

}

</style>

</head>


<body>


<header>

<div class="header-inner">


<div class="logo">

<img
    src="../assets/logo.png"
    alt="Unique EduZone Logo"
>

<div class="logo-text">
Unique EduZone
</div>

</div>


<a
    href="../index.html"
    class="back-btn"
>

← Home

</a>


</div>

</header>



<div class="container">



<section class="hero">


<h1>
11 ශ්‍රේණිය – පාඩම 03 Quiz
</h1>


<p>
අලෙවිකරණය
</p>


<p
style="margin-top:8px;color:#aaa"
>

ප්‍රශ්න 10 • එක් ප්‍රශ්නයකට එක් නිවැරදි පිළිතුරක්

</p>


<div class="progress">

<div
    class="progress-fill"
    id="progressFill"
>
</div>

</div>


<p
id="progressText"
style="margin-top:7px;color:#d4af37;font-weight:bold"
>

ප්‍රශ්නය 1 / 10

</p>


</section>



<section
class="quiz-box"
id="quizBox"
>
</section>



<section
class="result-box"
id="resultBox"
>


<h2>
Quiz ප්‍රතිඵලය
</h2>


<div
class="score"
id="score"
>
</div>


<p
id="resultMessage"
>
</p>


<div
class="review"
id="review"
>
</div>


<button
onclick="restartQuiz()"
>

නැවත Quiz කරන්න

</button>


<button
onclick="completeQuiz()"
>

✓ Quiz Complete

</button>


</section>


</div>



<footer>

© 2026 Unique EduZone |
Grade 11 Business & Accounting Studies

</footer>

>

</body>

</html>
