<script>
const questions=[
["භාණ්ඩ හා සේවා මිලදී ගැනීම හා විකිණීම හඳුන්වන්නේ කුමක් ලෙසද?",["නිෂ්පාදනය","වෙළෙඳාම","ප්‍රවාහනය","රක්ෂණය"],1,"භාණ්ඩ හා සේවා මිලදී ගැනීම හා විකිණීම වෙළෙඳාමයි."],
["අවසාන පරිභෝජනය සඳහා පාරිභෝගිකයන්ට භාණ්ඩ හා සේවා විකිණීම කුමක්ද?",["තොග වෙළෙඳාම","ආනයන වෙළෙඳාම","සිල්ලර වෙළෙඳාම","අපනයන වෙළෙඳාම"],2,"අවසාන පාරිභෝගිකයා සඳහා විකිණීම සිල්ලර වෙළෙඳාමයි."],
["නැවත විකිණීමේ අරමුණින් විශාල ප්‍රමාණයකින් භාණ්ඩ මිලදීගෙන වෙළෙඳුන්ට විකිණීම කුමක්ද?",["සිල්ලර වෙළෙඳාම","තොග වෙළෙඳාම","ආනයනය","අපනයනය"],1,"වෙළෙඳුන්ට නැවත විකිණීම සඳහා විශාල ප්‍රමාණයෙන් භාණ්ඩ විකිණීම තොග වෙළෙඳාමයි."],
["විදේශ රටකින් භාණ්ඩ හෝ සේවා තම රටට ලබාගැනීම කුමක්ද?",["ආනයන වෙළෙඳාම","අපනයන වෙළෙඳාම","සිල්ලර වෙළෙඳාම","දේශීය වෙළෙඳාම"],0,"විදේශ රටකින් තම රටට ලබාගැනීම ආනයන වෙළෙඳාමයි."],
["නිශ්චිත මුදලක් නිශ්චිත කාලයකට නියමිත පොලී අනුපාතයක් යටතේ බැංකුවක තැන්පත් කිරීම කුමක්ද?",["ජංගම ගිණුම","ඉතිරි කිරීමේ ගිණුම","ස්ථාවර තැන්පතුව","බැංකු අයිරාව"],2,"නිශ්චිත කාලයකට නියමිත පොලී අනුපාතයක් යටතේ තබන තැන්පතුව ස්ථාවර තැන්පතුවකි."],
["චෙක්පත් මගින් නිතර ගනුදෙනු කිරීමට වඩාත් සම්බන්ධ ගිණුම කුමක්ද?",["ජංගම ගිණුම","ස්ථාවර තැන්පතුව","ඉතිරි කිරීමේ ගිණුම","ණය ගිණුම"],0,"ජංගම ගිණුම ව්‍යාපාරික ගනුදෙනු සහ චෙක්පත් සඳහා භාවිත කරයි."],
["බැංකු ගිණුමේ ඇති මුදලින් සෘජුව ගෙවීම් කිරීමට භාවිත කරන කාඩ්පත කුමක්ද?",["Credit Card","Debit Card","Insurance Card","ATM Receipt"],1,"Debit Card මගින් ගිණුමේ ඇති මුදලින් සෘජුව ගෙවීම් කළ හැක."],
["රක්ෂණ ගිවිසුමට අදාළ වැදගත් තොරතුරු නිවැරදිව හෙළි කිරීමේ මූලධර්මය කුමක්ද?",["හානි පූරණය","රක්ෂ්‍ය හිමිකම","උපරිම විශ්වාසය","ප්‍රවාහනය"],2,"වැදගත් කරුණු නිවැරදිව හෙළි කිරීම උපරිම විශ්වාසයේ මූලධර්මයට අදාළ වේ."],
["දේපළ රක්ෂණයට වඩාත් අදාළ නිදසුන කුමක්ද?",["ගොඩනැගිල්ලකට ගින්නකින් සිදුවන හානිය","දරුවෙකුගේ අධ්‍යාපන අරමුදල","සේවක වැටුප් ගෙවීම","බැංකු ගිණුමක් විවෘත කිරීම"],0,"ගොඩනැගිලි, යන්ත්‍ර සූත්‍ර, රථවාහන සහ භාණ්ඩ තොග වැනි දේපළ සඳහා දේපළ රක්ෂණය අදාළ වේ."],
["ජංගම ගිණුමේ ශේෂයට වඩා වැඩි මුදලක් සඳහා ගෙවීමට බැංකුව ලබාදෙන පහසුකම කුමක්ද?",["ස්ථාවර තැන්පතුව","බැංකු අයිරාව","Debit Card","රක්ෂණ සේවාව"],1,"ගිණුමේ ශේෂයට වඩා වැඩි මුදලක් සඳහා ගෙවීමට අවසර දෙන පහසුකම බැංකු අයිරාවයි."]
];

let current=0,answers=Array(10).fill(null),finished=false;

function render(){
 const q=questions[current],box=document.getElementById("quizBox");
 let h='<div class="question active"><div class="question-number">ප්‍රශ්නය '+(current+1)+' / 10</div><h2>'+q[0]+'</h2>';
 q[1].forEach((o,i)=>h+='<button class="option '+(answers[current]===i?'selected':'')+'" onclick="selectOption('+i+')">'+String.fromCharCode(65+i)+'. '+o+'</button>');
 h+='<div class="note">ඉඟිය: ප්‍රශ්නයේ අර්ථය සහ පාඩමේ අදාළ සංකල්පය සසඳන්න.</div><div class="controls">';
 h+='<button class="prev" onclick="previous()" '+(current===0?'disabled':'')+'>← පෙර</button>';
 h+=(current<9?'<button class="next" onclick="next()">ඊළඟ →</button>':'<button class="submit" onclick="submitQuiz()">Quiz Submit ✓</button>');
 h+='</div></div>';box.innerHTML=h;
 document.getElementById("progressFill").style.width=((current+1)*10)+'%';
 document.getElementById("progressText").textContent='ප්‍රශ්නය '+(current+1)+' / 10';
}
function selectOption(i){answers[current]=i;render()}
function next(){if(answers[current]===null){alert("කරුණාකර පිළිතුරක් තෝරන්න.");return}current++;render()}
function previous(){if(current>0){current--;render()}}
function submitQuiz(){
 if(answers.some(a=>a===null)){alert("සියලුම ප්‍රශ්නවලට පිළිතුරු ලබාදී පසුව Submit කරන්න.");return}
 finished=true;let score=0;
 questions.forEach((q,i)=>{if(answers[i]===q[2])score++});
 document.getElementById("quizBox").style.display="none";
 document.getElementById("resultBox").style.display="block";
 document.getElementById("score").textContent=score+" / 10";
 document.getElementById("resultMessage").textContent=score===10?"විශිෂ්ටයි! පාඩම ඉතා හොඳින් අවබෝධ කරගෙන ඇත.":score>=7?"හොඳයි! තව ටිකක් පුනරීක්ෂණය කරන්න.":"පාඩම නැවත අධ්‍යයනය කර Quiz එක නැවත කරන්න.";
 let r="";
 questions.forEach((q,i)=>{r+='<div class="review-item"><strong>'+(i+1)+'. '+q[0]+'</strong><br>'+(answers[i]===q[2]?'✓ ඔබගේ පිළිතුර නිවැරදියි. ':'✗ නිවැරදි පිළිතුර: '+q[1][q[2]]+'. ')+q[3]+'</div>'});
 document.getElementById("review").innerHTML=r;
 localStorage.setItem("grade11_lesson1_quiz_score",score);
 localStorage.setItem("grade11_lesson1_quiz_completed","true");
}
function restartQuiz(){current=0;answers=Array(10).fill(null);finished=false;document.getElementById("resultBox").style.display="none";document.getElementById("quizBox").style.display="block";render()}
function completeQuiz(){localStorage.setItem("grade11_lesson1_quiz_completed","true");alert("✓ Grade 11 Lesson 1 Quiz සම්පූර්ණ කරන ලදී!")}
render();
</script>
